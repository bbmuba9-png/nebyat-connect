<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nebyat Connect - Voice Call</title>
    <script src="/socket.io/socket.io.js"></script>
    <style>
        body { font-family: Arial, sans-serif; text-align: center; padding: 30px; background: #f4f4f9; }
        h1 { color: #333; }
        .box { background: white; padding: 20px; margin: 15px auto; width: 300px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        input { padding: 10px; font-size: 16px; width: 80%; margin-bottom: 10px; }
        button { padding: 10px 20px; font-size: 16px; background: #28a745; color: white; border: none; border-radius: 4px; cursor: pointer; margin-top: 5px; }
        button:hover { background: #218838; }
        #call-interface, #active-call { display: none; }
    </style>
</head>
<body>

    <h1>Nebyat Connect</h1>

    <!-- 1. ስም እና ስልክ ቁጥር መመዝገቢያ ክፍል -->
    <div id="register-container" class="box">
        <h3>መመዝገቢያ</h3>
        <input type="text" id="name-input" placeholder="ስምዎን ያስገቡ (ምሳሌ፦ ከበደ)">
        <br>
        <input type="text" id="phone-input" placeholder="ስልክ ቁጥር (ምሳሌ፦ 0911223344)">
        <br>
        <button id="register-btn">ተመዝገብ (Register)</button>
    </div>

    <!-- 2. መደወያ ክፍል -->
    <div id="call-interface" class="box">
        <h3 id="my-info-display"></h3>
        <input type="text" id="target-input" placeholder="የሚደውሉበትን ቁጥር ያስገቡ">
        <br>
        <button id="call-btn">ደውል (Call)</button>
    </div>

    <!-- 3. ንቁ ጥሪ ማሳያ -->
    <div id="active-call" class="box">
        <h3>ጥሪ ተገናኝቷል! (Connected)</h3>
        <p id="call-status">እየተነጋገሩ ነው...</p>
        <button id="play-audio-btn" style="background: #007bff;">ድምጽ አጫውት (Listen Audio)</button>
    </div>

    <!-- ድምጽ ማዳመጫ ኤለመንት -->
    <audio id="remote-audio" autoplay playsinline></audio>

    <script>
        const socket = io();

        const registerContainer = document.getElementById('register-container');
        const callInterface = document.getElementById('call-interface');
        const activeCallBox = document.getElementById('active-call');
        const nameInput = document.getElementById('name-input');
        const phoneInput = document.getElementById('phone-input');
        const registerBtn = document.getElementById('register-btn');
        const myInfoDisplay = document.getElementById('my-info-display');
        const targetInput = document.getElementById('target-input');
        const callBtn = document.getElementById('call-btn');
        const remoteAudio = document.getElementById('remote-audio');
        const playAudioBtn = document.getElementById('play-audio-btn');

        let myPhoneNumber = '';
        let myName = '';
        let peerConnection;
        let localStream;
        let targetSocketIdGlobal;

        const iceServers = {
            iceServers: [{ urls: 'stun:stun.l.google.com:19302' }]
        };

        // ማይክሮፎን ፈቃድ መጠየቅ
        async function setupLocalStream() {
            try {
                localStream = await navigator.mediaDevices.getUserMedia({ audio: true, video: false });
            } catch (error) {
                alert('ማይክሮፎን መጠቀም አልተቻለም: ' + error.message);
            }
        }

        // ገጽ ሲከፈት መረጃው በ localStorage ውስጥ መኖሩን ማረጋገጥ (Auto-login)
        window.addEventListener('load', async () => {
            const savedPhone = localStorage.getItem('nebyat_phone');
            const savedName = localStorage.getItem('nebyat_name');

            if (savedPhone && savedName) {
                myPhoneNumber = savedPhone;
                myName = savedName;
                await setupLocalStream();
                socket.emit('register-user', { phoneNumber: myPhoneNumber, name: myName });
                registerContainer.style.display = 'none';
                callInterface.style.display = 'block';
                myInfoDisplay.innerText = `${myName} (${myPhoneNumber})`;
            }
        });

        // ስም እና ስልክ ቁጥር መመዝገብ
        registerBtn.addEventListener('click', async () => {
            myName = nameInput.value.trim();
            myPhoneNumber = phoneInput.value.trim();

            if (myName && myPhoneNumber) {
                localStorage.setItem('nebyat_phone', myPhoneNumber);
                localStorage.setItem('nebyat_name', myName);
                await setupLocalStream();
                socket.emit('register-user', { phoneNumber: myPhoneNumber, name: myName });
                registerContainer.style.display = 'none';
                callInterface.style.display = 'block';
                myInfoDisplay.innerText = `${myName} (${myPhoneNumber})`;
            } else {
                alert('እባክዎ ስምዎን እና ስልክ ቁጥርዎን በትክክል ያስገቡ!');
            }
        });

        function createPeerConnection(targetSocketId) {
            peerConnection = new RTCPeerConnection(iceServers);

            if (localStream) {
                localStream.getTracks().forEach(track => peerConnection.addTrack(track, localStream));
            }

            peerConnection.ontrack = event => {
                remoteAudio.srcObject = event.streams[0];
                remoteAudio.play().catch(e => console.log("Autoplay blocked:", e));
            };

            peerConnection.onicecandidate = event => {
                if (event.candidate) {
                    socket.emit('ice-candidate', {
                        targetSocketId: targetSocketId,
                        candidate: event.candidate
                    });
                }
            };
        }

        // ጥሪ ማድረግ
        callBtn.addEventListener('click', async () => {
            const targetPhoneNumber = targetInput.value.trim();
            if (!targetPhoneNumber) {
                alert('እባክዎ የሚደውሉበትን ቁጥር ያስገቡ!');
                return;
            }

            peerConnection = new RTCPeerConnection(iceServers);
            if (localStream) {
                localStream.getTracks().forEach(track => peerConnection.addTrack(track, localStream));
            }

            peerConnection.ontrack = event => {
                remoteAudio.srcObject = event.streams[0];
                remoteAudio.play().catch(e => console.log("Autoplay blocked:", e));
            };

            peerConnection.onicecandidate = event => {
                if (event.candidate && targetSocketIdGlobal) {
                    socket.emit('ice-candidate', { targetSocketId: targetSocketIdGlobal, candidate: event.candidate });
                }
            };

            const offer = await peerConnection.createOffer();
            await peerConnection.setLocalDescription(offer);

            socket.emit('call-user', {
                targetPhoneNumber: targetPhoneNumber,
                callerPhoneNumber: myPhoneNumber,
                callerName: myName,
                offer: offer
            });

            alert('ጥሪ ተልኳል፣ ምላሽ በመጠበቅ ላይ...');
        });

        // ድምጽ በድጋሚ ማጫወቻ ቁልፍ ለማስጀመር
        playAudioBtn.addEventListener('click', () => {
            remoteAudio.play().then(() => {
                alert('ድምጽ ማጫወት ተጀምሯል!');
            }).catch(e => {
                alert('ድምጽ ማጫወት አልተቻለም: ' + e.message);
            });
        });

        // ገቢ ጥሪ ሲመጣ
        socket.on('incoming-call', async ({ callerPhoneNumber, callerName, callerSocketId, offer }) => {
            targetSocketIdGlobal = callerSocketId;
            const accept = confirm(`ከ ${callerName} (${callerPhoneNumber}) የድምጽ ጥሪ መጥቷል መቀበል ይፈልጋሉ?`);
            
            if (accept) {
                createPeerConnection(callerSocketId);
                await peerConnection.setRemoteDescription(new RTCSessionDescription(offer));
                const answer = await peerConnection.createAnswer();
                await peerConnection.setLocalDescription(answer);

                socket.emit('accept-call', {
                    callerSocketId: callerSocketId,
                    answer: answer
                });

                callInterface.style.display = 'none';
                activeCallBox.style.display = 'block';
            }
        });

        // ጥሪው ሲቀበል
        socket.on('call-accepted', async ({ answer }) => {
            await peerConnection.setRemoteDescription(new RTCSessionDescription(answer));
            callInterface.style.display = 'none';
            activeCallBox.style.display = 'block';
        });

        // ICE candidate መቀበል
        socket.on('ice-candidate', async ({ candidate }) => {
            if (peerConnection) {
                await peerConnection.addIceCandidate(new RTCIceCandidate(candidate));
            }
        });

        // ጥሪ ካልተሳካ
        socket.on('call-failed', ({ message }) => {
            alert(message);
        });
    </script>
</body>
</html>
